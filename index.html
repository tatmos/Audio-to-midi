<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio to MIDI Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Audio to MIDI Converter</h1>
            <p class="subtitle">オーディオファイルからMIDIを生成</p>
        </header>

        <div class="controls-panel">
            <div class="file-controls">
                <label for="file-input" class="btn btn-primary">
                    <input type="file" id="file-input" accept=".wav,.mp3,audio/*" hidden>
                    WAVファイルをアップロード
                </label>
                <button id="play-btn" class="btn btn-play" disabled>▶ 再生</button>
                <button id="stop-btn" class="btn btn-stop" disabled>■ 停止</button>
                <button id="export-midi-btn" class="btn btn-secondary" disabled>MIDIに書き出す</button>
            </div>
        </div>

        <div class="waveform-container">
            <div class="original-waveform-container">
                <div class="track-header">
                    <div class="track-label">波形（範囲選択）</div>
                    <button id="clear-audio" class="clear-btn" title="オーディオをクリア" disabled>✕</button>
                </div>
                <div class="waveform-wrapper drop-zone" id="drop-zone">
                    <button class="drop-overlay" id="drop-overlay">波形をアップロード</button>
                    <canvas id="waveform-canvas" class="waveform-canvas"></canvas>
                </div>
                <div id="ruler" class="time-ruler"></div>
            </div>
        </div>

        <div id="status" class="status"></div>
    </div>

    <script src="originalWaveformViewer.js"></script>
    <script src="audioPlayer.js"></script>
    <script src="audioProcessor.js"></script>
    <script src="uiController.js"></script>
    <script src="app.js"></script>
</body>
</html>
